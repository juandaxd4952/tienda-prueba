<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

</head>

<body>

<h1>Iniciar sesión</h1>

<form method="POST">

    <input
        type="email"
        name="correo"
        placeholder="Correo"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Contraseña"
        required
    >

    <br><br>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

<a href="/registro">
    Crear cuenta
</a>

</body>

</html>
