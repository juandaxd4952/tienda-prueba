<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pago</title>

</head>


<body>


    <h1>💳 Confirmar pago</h1>


    <h2>
        Resumen del pedido
    </h2>


    {% for item in items %}

        <div>

            <h3>
                {{ item[1] }}
            </h3>

            <p>
                Cantidad:
                {{ item[3] }}
            </p>

            <p>
                Precio:
                ${{ item[2] }}
            </p>

            <p>
                Subtotal:
                ${{ item[4] }}
            </p>

        </div>

        <hr>

    {% endfor %}


    <h2>

        Total:
        ${{ total }}

    </h2>


    <br>


    <h3>
        Método de pago
    </h3>


    <form
        action="{{ url_for('procesar_pago') }}"
        method="POST"
    >


        <label>

            <input
                type="radio"
                name="metodo_pago"
                value="prueba"
                checked
            >

            💳 Pago de prueba

        </label>


        <br>
        <br>


        <button type="submit">

            ✅ Confirmar y pagar

        </button>


    </form>


    <br>


    <a href="{{ url_for('carrito') }}">

        ← Volver al carrito

    </a>


</body>

</html>
